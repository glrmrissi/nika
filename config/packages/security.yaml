security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: false
                default_target_path: app_home
                success_handler: App\Security\LoginSuccessHandler
            logout:
                path: app_logout
                target: app_home
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /
            two_factor:
                auth_form_path: /2fa
                check_path: /2fa_check

    access_control:
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/register$, roles: PUBLIC_ACCESS }
        - { path: ^/forgot-password$, roles: PUBLIC_ACCESS }
        - { path: ^/reset-password, roles: PUBLIC_ACCESS }
        - { path: ^/verify-email$, roles: PUBLIC_ACCESS }
        - { path: ^/2fa$, roles: PUBLIC_ACCESS }
        - { path: ^/2fa_check$, roles: PUBLIC_ACCESS }
        - { path: ^/api/kanji/select-batch$, roles: ROLE_USER }
        - { path: ^/api/kanji$, roles: PUBLIC_ACCESS }
        - { path: ^/api/grammar/\d+$, roles: PUBLIC_ACCESS }
        - { path: ^/api/grammar$, roles: PUBLIC_ACCESS }
        - { path: ^/grammar/review$, roles: ROLE_USER }
        - { path: ^/api/grammar/review/, roles: ROLE_USER }
        - { path: ^/grammar/quiz$, roles: ROLE_USER }
        - { path: ^/api/grammar/quiz/, roles: ROLE_USER }
        - { path: ^/kanji/\d+/select$, roles: ROLE_USER }
        - { path: ^/kanji/\d+/toggle-done$, roles: ROLE_USER }
        - { path: ^/kanji$, roles: PUBLIC_ACCESS }
        - { path: ^/grammar$, roles: PUBLIC_ACCESS }
        - { path: ^/profile$, roles: PUBLIC_ACCESS }
        - { path: ^/profile/edit$, roles: ROLE_USER }
        - { path: ^/profile/avatar/remove$, roles: ROLE_USER }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
